name: Watch upstream RustDesk for releases and security advisories

# Weekly: compare upstream's newest client release with the version this fork
# pins (Cargo.toml), and list published security advisories for the client and
# the relay server. Anything new becomes ONE issue in this repository (updated
# in place on later runs); nothing new means no issue and no noise. GitHub
# emails the owner for new issues in a watched repository.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC (10:00 PKT)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  SERVER_PINNED: "1.1.14" # deploy/docker-compose.yml in nique-pk/nique

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compare with upstream
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "client pinned: $pinned"

          latest="$(gh api repos/rustdesk/rustdesk/releases --paginate --jq '[.[] | select(.prerelease==false and .draft==false)] | .[0].tag_name')"
          latest_url="$(gh api repos/rustdesk/rustdesk/releases --paginate --jq '[.[] | select(.prerelease==false and .draft==false)] | .[0].html_url')"
          echo "client latest: $latest"

          newer=0
          if [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n1)" != "$pinned" ]; then newer=1; fi

          adv() { # <owner/repo> -> markdown lines of published advisories (newest first)
            gh api "repos/$1/security-advisories?state=published&per_page=20" \
              --jq '.[] | "- **\(.ghsa_id)** \(.severity // "unknown") — \(.summary) (\(.published_at[0:10])) \(.html_url)"' 2>/dev/null || true
          }
          client_adv="$(adv rustdesk/rustdesk)"
          server_adv="$(adv rustdesk/rustdesk-server)"

          {
            echo "newer=$newer"
            echo "latest=$latest"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"

          body="upstream-body.md"
          {
            echo "Weekly upstream check for the Nique POS Helper client. Generated by upstream-watch.yml."
            echo
            echo "## Client"
            echo "- pinned in this fork: **$pinned**"
            echo "- newest upstream release: **$latest** — $latest_url"
            if [ "$newer" = 1 ]; then
              echo
              echo "**A newer client exists.** Read its release notes. If it carries a security fix that applies to Windows, repin: fork branch \`nique\` onto tag \`$latest\`, re-apply the Nique changes, run build-windows.yml, commit the new program into nique-pk/nique."
            fi
            echo
            echo "## Published security advisories — client (rustdesk/rustdesk)"
            if [ -n "$client_adv" ]; then echo "$client_adv"; else echo "- none published"; fi
            echo
            echo "## Published security advisories — relay server (rustdesk/rustdesk-server, we run $SERVER_PINNED)"
            if [ -n "$server_adv" ]; then echo "$server_adv"; else echo "- none published"; fi
          } > "$body"
          cat "$body"

          # Fingerprint what would be reported; only changes open/update the issue.
          fp="$(printf '%s\n%s\n%s\n' "$latest" "$client_adv" "$server_adv" | sha256sum | cut -c1-16)"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          if [ "$newer" = 1 ] || [ -n "$client_adv" ] || [ -n "$server_adv" ]; then
            echo "report=1" >> "$GITHUB_OUTPUT"
          else
            echo "report=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the issue
        if: steps.cmp.outputs.report == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream RustDesk: newest ${{ steps.cmp.outputs.latest }} vs pinned ${{ steps.cmp.outputs.pinned }}"
          FP: ${{ steps.cmp.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- upstream-watch -->"
          existing="$(gh issue list --label upstream-watch --state open --json number,body --jq '.[0] | "\(.number)\t\(.body)"' || true)"
          num="${existing%%	*}"
          if [ -n "$num" ] && [ "$num" != "null" ]; then
            if printf '%s' "${existing#*	}" | grep -q "fingerprint: $FP"; then
              echo "issue #$num already carries fingerprint $FP — nothing new since last run"
              exit 0
            fi
            { echo "$marker"; echo "fingerprint: $FP"; echo; cat upstream-body.md; } > body.md
            gh issue edit "$num" --title "$TITLE" --body-file body.md
            gh issue comment "$num" --body "Updated $(date -u +%Y-%m-%d): something upstream changed since the last check. See the issue body."
            echo "updated issue #$num"
          else
            gh label create upstream-watch --description "weekly upstream RustDesk check" --color 0E8A16 2>/dev/null || true
            { echo "$marker"; echo "fingerprint: $FP"; echo; cat upstream-body.md; } > body.md
            gh issue create --title "$TITLE" --label upstream-watch --body-file body.md
          fi
