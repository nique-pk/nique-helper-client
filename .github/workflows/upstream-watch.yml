name: Watch upstream RustDesk for releases and security advisories

# Weekly: compare upstream's newest client release with the version this fork
# pins (Cargo.toml), and list the CVEs the NVD (nvd.nist.gov) records against
# RustDesk — client, server and the shared library alike, since NVD indexes the
# product, not the repository (RustDesk publishes no advisories on GitHub).
# Anything new becomes ONE issue in this repository, updated in place on later
# runs; nothing new means no issue and no noise. GitHub emails the owner for new
# issues in a watched repository.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC (10:00 PKT)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  SERVER_PINNED: "1.1.14" # deploy/docker-compose.yml in nique-pk/nique

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compare with upstream
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          rel="$(gh api repos/rustdesk/rustdesk/releases/latest)"
          latest="$(jq -r .tag_name <<<"$rel")"
          latest_url="$(jq -r .html_url <<<"$rel")"
          latest_date="$(jq -r '.published_at[0:10]' <<<"$rel")"
          echo "client pinned: $pinned / latest: $latest ($latest_date)"

          newer=0
          if [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n1)" != "$pinned" ]; then newer=1; fi

          # NVD: every CVE whose text mentions RustDesk. Newest first. Recent = 120 days.
          nvd="$(curl -sS --retry 3 --retry-delay 10 -m 60 \
            'https://services.nvd.nist.gov/rest/json/cves/2.0?keywordSearch=rustdesk&resultsPerPage=100' || echo '{}')"
          since="$(date -u -d '120 days ago' +%Y-%m-%d)"
          cves_all="$(jq -r '.vulnerabilities[]?.cve | "\(.published[0:10])\t\(.id)\t\((.metrics.cvssMetricV31[0].cvssData.baseSeverity // .metrics.cvssMetricV40[0].cvssData.baseSeverity // "n/a"))\t\(.descriptions[0].value | gsub("\n"; " ") | .[0:160])"' <<<"$nvd" | sort -r)"
          cves_recent="$(awk -F'\t' -v s="$since" '$1 >= s' <<<"$cves_all")"
          total="$(printf '%s\n' "$cves_all" | grep -c . || true)"
          recent_n="$(printf '%s\n' "$cves_recent" | grep -c . || true)"
          echo "NVD: $total CVEs mention RustDesk, $recent_n published since $since"

          body="upstream-body.md"
          {
            echo "Weekly upstream check for the Nique POS Helper client. Generated by upstream-watch.yml."
            echo
            echo "## Client release"
            echo "- pinned in this fork: **$pinned**"
            echo "- newest upstream: **$latest** ($latest_date) — $latest_url"
            if [ "$newer" = 1 ]; then
              echo
              echo "**A newer client exists.** Read its notes. If it carries a fix that applies to Windows, repin: rebase branch \`nique\` onto tag \`$latest\`, re-apply the Nique changes, run build-windows.yml, commit the new program into nique-pk/nique."
            fi
            echo
            echo "## CVEs mentioning RustDesk published since $since (NVD)"
            if [ -n "$cves_recent" ]; then
              echo "| published | CVE | severity | summary |"; echo "|---|---|---|---|"
              awk -F'\t' '{ printf "| %s | [%s](https://nvd.nist.gov/vuln/detail/%s) | %s | %s |\n", $1, $2, $2, $3, $4 }' <<<"$cves_recent"
            else
              echo "- none"
            fi
            echo
            echo "We run client $pinned and relay server $SERVER_PINNED. A CVE that names an older version only is already covered; one that names ours or a later one needs a repin (client) or a compose bump (server)."
            echo
            echo "<details><summary>All $total RustDesk CVEs on record</summary>"; echo
            echo "| published | CVE | severity | summary |"; echo "|---|---|---|---|"
            awk -F'\t' '{ printf "| %s | [%s](https://nvd.nist.gov/vuln/detail/%s) | %s | %s |\n", $1, $2, $2, $3, $4 }' <<<"$cves_all"
            echo; echo "</details>"
          } > "$body"
          cat "$body"

          # Fingerprint: newest release + the set of CVE ids. Only a change opens/updates the issue.
          fp="$(printf '%s\n%s\n' "$latest" "$(cut -f2 <<<"$cves_all")" | sha256sum | cut -c1-16)"
          {
            echo "newer=$newer"; echo "latest=$latest"; echo "pinned=$pinned"; echo "fingerprint=$fp"
            if [ "$newer" = 1 ] || [ "$recent_n" -gt 0 ]; then echo "report=1"; else echo "report=0"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.cmp.outputs.report == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream RustDesk: newest ${{ steps.cmp.outputs.latest }} vs pinned ${{ steps.cmp.outputs.pinned }}"
          FP: ${{ steps.cmp.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create upstream-watch --description "weekly upstream RustDesk check" --color 0E8A16 2>/dev/null || true
          num="$(gh issue list --label upstream-watch --state open --json number --jq '.[0].number // empty')"
          { echo "<!-- upstream-watch -->"; echo "fingerprint: $FP"; echo; cat upstream-body.md; } > body.md
          if [ -n "$num" ]; then
            if gh issue view "$num" --json body --jq .body | grep -q "fingerprint: $FP"; then
              echo "issue #$num already carries fingerprint $FP — nothing new since last run"; exit 0
            fi
            gh issue edit "$num" --title "$TITLE" --body-file body.md
            gh issue comment "$num" --body "Updated $(date -u +%Y-%m-%d): something upstream changed since the last check. See the issue body."
            echo "updated issue #$num"
          else
            gh issue create --title "$TITLE" --label upstream-watch --body-file body.md
          fi
